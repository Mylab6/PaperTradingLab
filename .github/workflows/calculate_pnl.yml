name: Calculate Portfolio PnL

on:
  workflow_dispatch:  # manual trigger only

jobs:
  calculate_pnl:
    runs-on: ubuntu-latest
    environment: Small

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python 3.11
      uses: actions/setup-python@v2
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f AgressiveStockStrat/requirements.txt ]; then pip install -r AgressiveStockStrat/requirements.txt; fi

    - name: Calculate Portfolio PnL
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        ALPACA_API_URL: ${{ secrets.ALPACA_API_URL }}
      run: python AgressiveStockStrat/calculate_pnl.py

    - name: Upload PnL CSV Reports
      uses: actions/upload-artifact@v3
      with:
        name: pnl-reports-${{ github.run_number }}
        path: |
          AgressiveStockStrat/pnl_summary_*.csv
          AgressiveStockStrat/positions_*.csv
          AgressiveStockStrat/portfolio_history_*.csv
          AgressiveStockStrat/orders_*.csv
        retention-days: 30
        if-no-files-found: warn

    - name: Display PnL Summary in Logs
      if: always()
      run: |
        echo "PnL Calculation completed. Check the uploaded artifacts for detailed CSV reports."
        if [ -f AgressiveStockStrat/pnl_summary_*.csv ]; then
          echo "Generated files:"
          ls -la AgressiveStockStrat/pnl_*.csv AgressiveStockStrat/positions_*.csv AgressiveStockStrat/portfolio_*.csv AgressiveStockStrat/orders_*.csv 2>/dev/null || echo "Some CSV files may not have been generated."
        fi

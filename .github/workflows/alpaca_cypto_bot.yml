name: Run Alpaca crypto bot

on:
  schedule:
    - cron: '*/10 * * * *' # run every 30 minutes
  workflow_dispatch:  # manual trigger

jobs:
  build_crypto:
    runs-on: ubuntu-latest
    environment: Crypto

    steps:
    - uses: actions/checkout@v2

    - name: Exit if not on main branch
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then 
          echo "Workflow is not running on main branch. Exiting..."
          exit 1
        fi

    - name: Set up Python 3.11
      uses: actions/setup-python@v2
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f BTCParty/requirements.txt ]; then pip install -r BTCParty/requirements.txt; fi

    - name: Run Crypto Trading Bot
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        ALPACA_API_URL: ${{ secrets.ALPACA_API_URL }}
      run: python BTCParty/alpaca_cypto.py

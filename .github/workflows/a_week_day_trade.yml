name: Run Alpaca Trading Bot

on:
  schedule:
    - cron: '0 17 * * 1-5'  # run at noon on weekdays
  workflow_dispatch:  # manual trigger

jobs:
  build_small:
    runs-on: ubuntu-latest
    environment: Small

    steps:
    - uses: actions/checkout@v2

    - name: Exit if not on main branch
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then 
          echo "Workflow is not running on main branch. Exiting..."
          exit 1
        fi

    - name: Set up Python 3.11
      uses: actions/setup-python@v2
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f AgressiveStockStrat/requirements.txt ]; then pip install -r AgressiveStockStrat/requirements.txt; fi

    - name: Run Alpaca Trading Bot
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        ALPACA_API_URL: ${{ secrets.ALPACA_API_URL }}
      run: python AgressiveStockStrat/alpaca_trade.py

  build_big:
    runs-on: ubuntu-latest
    environment: Big

    steps:
    - uses: actions/checkout@v2

    - name: Exit if not on main branch
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then 
          echo "Workflow is not running on main branch. Exiting..."
          exit 1
        fi

    - name: Set up Python 3.11
      uses: actions/setup-python@v2
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f AgressiveStockStrat/requirements.txt ]; then pip install -r AgressiveStockStrat/requirements.txt; fi

    - name: Run Alpaca Trading Bot
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        ALPACA_API_URL: ${{ secrets.ALPACA_API_URL }}
      run: python AgressiveStockStrat/alpaca_trade.py
